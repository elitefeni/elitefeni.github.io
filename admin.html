<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>অ্যাডমিন প্যানেল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pine:#0f3d36;--gold:#b8862b;--line:#d3dfda;--bg:#f5f8f6;--mut:#52635d}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 'Hind Siliguri',sans-serif;background:var(--bg);color:#16241f}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--pine);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:19px}
main{padding:20px;max-width:1300px;margin:0 auto}
input,select,textarea{padding:8px 10px;border:1px solid #b9c9c3;border-radius:6px;font:inherit;background:#fff;max-width:100%}
button{font:600 15px 'Hind Siliguri',sans-serif;padding:8px 16px;border:0;border-radius:6px;background:var(--pine);color:#fff;cursor:pointer}
button.g{background:var(--gold);color:#1b1405}button.o{background:transparent;color:#fff;border:1px solid #fff}button.x{background:#8a1f11}
.login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:10px;border-top:6px solid var(--gold)}
.login input{width:100%;margin:10px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{background:#fff;color:var(--pine);border:1px solid var(--line)}.tabs button.on{background:var(--pine);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
th{background:#e7efeb}
td input{width:96px}td input.nt{width:150px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.sum small{color:var(--mut);display:block}.sum b{font-size:22px}
.msg{padding:8px 12px;border-radius:6px;background:#fbe9e7;color:#8a1f11;margin-bottom:12px;display:none}
.hide{display:none}
</style>
</head>
<body>
<div id="lg" class="login"><h2 style="margin:0">অ্যাডমিন লগইন</h2>
<form id="lf"><input type="password" id="pw" placeholder="পাসওয়ার্ড" required autocomplete="current-password"><button class="g" type="submit">প্রবেশ করুন</button></form>
<div class="msg" id="lm" style="margin-top:12px"></div></div>

<div id="ap" class="hide">
<header><b>অ্যাডমিন প্যানেল</b><div><button class="o" id="rf">রিফ্রেশ</button> <button class="o" id="lo">লগআউট</button></div></header>
<main>
<div class="msg" id="m"></div>
<div class="tabs"><button class="on" data-t="a">আবেদন</button><button data-t="h">হিসাব</button></div>

<div id="ta">
<div class="bar"><input id="q" placeholder="নাম, ফোন বা আইডি খুঁজুন"><select id="fs"><option value="">সব স্ট্যাটাস</option></select></div>
<div class="tw"><table><thead><tr><th>আইডি / তারিখ</th><th>সেবা</th><th>নাম ও ফোন</th><th>বিবরণ</th><th>স্ট্যাটাস</th><th>মোট বিল</th><th>জমা</th><th>বাকি</th><th>নোট</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>

<div id="th" class="hide">
<div class="sum" id="sm"></div>
<form class="bar" id="ef"><select id="et"><option>আয়</option><option>ব্যয়</option></select>
<input id="ed" placeholder="বিবরণ (যেমন অফিস ভাড়া)" required style="flex:1;min-width:180px"><input id="ea" type="number" min="1" placeholder="টাকা" required style="width:120px"><input id="edt" type="date"><button class="g" type="submit">যোগ করুন</button></form>
<div class="tw"><table style="min-width:600px"><thead><tr><th>তারিখ</th><th>ধরন</th><th>বিবরণ</th><th>টাকা</th><th></th></tr></thead><tbody id="eb"></tbody></table></div>
</div>
</main></div>

<script>
const API='https://script.google.com/macros/s/AKfycbzEzpIXppMRvTq4_zq553jeTH_xszrzz5grkJLes-tx7hIEf_xGkYoABmzjIBAlEVyDXQ/exec';
const ST=['নতুন','প্রক্রিয়াধীন','কাগজপত্র বাকি','সম্পন্ন','বাতিল'];
let T=sessionStorage.getItem('t'),apps=[],acc=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mny=n=>'৳ '+Number(n||0).toLocaleString('bn-BD');
function msg(t){const m=$('#m');m.textContent=t;m.style.display=t?'block':'none'}
async function call(d){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...d,token:T})});const j=await r.json();
 if(j.auth===false){logout();throw new Error('সেশন শেষ, আবার লগইন করুন')}if(!j.ok)throw new Error(j.error||'ত্রুটি');return j}
function logout(){T=null;sessionStorage.removeItem('t');$('#lg').classList.remove('hide');$('#ap').classList.add('hide')}
$('#lo').onclick=logout;
$('#lf').onsubmit=async e=>{e.preventDefault();try{const j=await call({action:'login',password:$('#pw').value});T=j.token;sessionStorage.setItem('t',T);$('#pw').value='';start()}
 catch(x){const m=$('#lm');m.textContent=x.message;m.style.display='block'}};
async function start(){$('#lg').classList.add('hide');$('#ap').classList.remove('hide');await load()}
async function load(){msg('');try{const j=await call({action:'data'});apps=j.apps;acc=j.acc;render()}catch(x){msg(x.message)}}
$('#rf').onclick=load;
$('#fs').innerHTML+=ST.map(s=>`<option>${s}</option>`).join('');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#ta').classList.toggle('hide',b.dataset.t!=='a');$('#th').classList.toggle('hide',b.dataset.t!=='h')});
$('#q').oninput=$('#fs').onchange=render;

function render(){
 const q=$('#q').value.trim().toLowerCase(),f=$('#fs').value;
 const L=apps.filter(a=>(!f||a.status===f)&&(!q||[a.id,a.name,a.phone].join(' ').toLowerCase().includes(q)));
 $('#tb').innerHTML=L.map(a=>`<tr data-id="${esc(a.id)}"><td>${esc(a.id)}<br><small>${esc(a.date)}</small></td><td>${esc(a.service)}</td>
 <td>${esc(a.name)}<br><a href="tel:${esc(a.phone)}">${esc(a.phone)}</a></td><td style="max-width:220px">${esc(a.details)}</td>
 <td><select class="s">${ST.map(s=>`<option${s===a.status?' selected':''}>${s}</option>`).join('')}</select></td>
 <td><input class="b" type="number" min="0" value="${Number(a.bill)||0}"></td><td><input class="p" type="number" min="0" value="${Number(a.paid)||0}"></td>
 <td>${mny((a.bill||0)-(a.paid||0))}</td><td><input class="nt" value="${esc(a.note)}" maxlength="300"></td><td><button class="sv">সংরক্ষণ</button></td></tr>`).join('')||'<tr><td colspan="10">কোনো আবেদন নেই</td></tr>';
 const sum=(arr,k)=>arr.reduce((t,x)=>t+(Number(x[k])||0),0);
 const inc=sum(acc.filter(x=>x.type==='আয়'),'amount'),exp=sum(acc.filter(x=>x.type==='ব্যয়'),'amount'),bill=sum(apps,'bill'),paid=sum(apps,'paid');
 $('#sm').innerHTML=[['আবেদনের মোট বিল',bill],['আবেদন থেকে জমা',paid],['মোট বাকি',bill-paid],['অন্যান্য আয়',inc],['মোট ব্যয়',exp],['নিট নগদ (জমা + আয় − ব্যয়)',paid+inc-exp]].map(([l,v])=>`<div><small>${l}</small><b>${mny(v)}</b></div>`).join('');
 $('#eb').innerHTML=acc.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.desc)}</td><td>${mny(x.amount)}</td><td><button class="x" data-del="${esc(x.id)}">মুছুন</button></td></tr>`).join('')||'<tr><td colspan="5">কোনো এন্ট্রি নেই</td></tr>';
}
$('#tb').onclick=async e=>{const b=e.target.closest('.sv');if(!b)return;const tr=b.closest('tr');b.disabled=true;
 try{await call({action:'updateApp',id:tr.dataset.id,status:tr.querySelector('.s').value,bill:tr.querySelector('.b').value,paid:tr.querySelector('.p').value,note:tr.querySelector('.nt').value});await load()}catch(x){msg(x.message)}b.disabled=false};
$('#ef').onsubmit=async e=>{e.preventDefault();try{await call({action:'addEntry',type:$('#et').value,desc:$('#ed').value,amount:$('#ea').value,date:$('#edt').value});e.target.reset();await load()}catch(x){msg(x.message)}};
$('#eb').onclick=async e=>{const b=e.target.closest('[data-del]');if(!b||!confirm('এই এন্ট্রি মুছবেন?'))return;try{await call({action:'delEntry',id:b.dataset.del});await load()}catch(x){msg(x.message)}};
if(T)start();
</script>
</body>
</html>
