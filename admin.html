<style>
:root{--pine:#0f3d36;--gold:#b8862b;--line:#d3dfda;--bg:#f5f8f6;--mut:#52635d}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.6 'Hind Siliguri',sans-serif;background:var(--bg);color:#16241f}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--pine);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:16px;max-width:1300px;margin:0 auto}
input,select,textarea{padding:8px 10px;border:1px solid #b9c9c3;border-radius:6px;font:inherit;background:#fff;max-width:100%;width:100%}
input[readonly]{background:#eef3f1}
button{font:600 15px 'Hind Siliguri',sans-serif;padding:8px 16px;border:0;border-radius:6px;background:var(--pine);color:#fff;cursor:pointer}
button.g{background:var(--gold);color:#fff}button.g:hover{filter:brightness(1.1)}button.o{background:transparent;color:#fff;border:1px solid #fff}button.o:hover{background:#ffffff2e}button.o2{background:#fff;color:var(--pine);border:1px solid var(--pine)}
button:disabled{opacity:.6}
.ic{padding:6px 8px;line-height:0}
.ib{background:none;color:var(--pine);border:1px solid var(--line);padding:5px 7px;line-height:0;margin:0 2px;background:#fff}.ib.dl{color:#8a1f11}.ib.rm,.ib.rm2{background:#c62828;color:#fff;border:0;width:36px;height:36px;font-size:24px;line-height:1;padding:0;border-radius:6px;margin:0}.ib.rm:hover,.ib.rm2:hover{background:#a81f1f}
.login{max-width:400px;width:calc(100% - 24px);margin:8vh auto 24px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px #0f3d3626;border:1px solid var(--line)}
.lh{background:var(--pine);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:center;text-align:center;gap:12px;border-bottom:4px solid var(--gold)}
.lh img{height:44px;max-width:64px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
.lh b{display:block;font-size:19px;line-height:1.3}.lh small{opacity:.85}
.lb{padding:24px 24px 18px}.lb h2{margin:0 0 2px;font-size:22px;color:var(--pine);text-align:center}.ls{text-align:center;margin:0 0 16px;color:var(--mut);font-size:14px}
.login label{display:block;font-weight:600;font-size:14px;color:var(--pine)}
.login input{margin:6px 0 14px;padding:11px 12px}
.pwr{position:relative}.pwr input{padding-right:46px}.pwr button{position:absolute;right:3px;top:6px;bottom:14px;width:42px;padding:0;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center}.pwr button:hover{color:var(--pine)}
.lbt{width:100%;padding:12px;font-size:17px}
.lbk{display:block;text-align:center;text-decoration:none;margin-top:14px;color:var(--pine);font-size:14px}
.lft{background:#f1f6f4;border-top:1px solid var(--line);padding:10px;text-align:center;font-size:13px;color:var(--mut)}
.dr{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:85vw;background:#fff;transform:translateX(-100%);transition:transform .2s;z-index:20;padding:14px;overflow:auto;box-shadow:2px 0 12px #0003}
.dr.on{transform:none}.dr>b{display:block;margin:4px 0 10px;color:var(--pine)}
.dr button{display:block;width:100%;text-align:left;background:none;color:var(--pine);padding:10px 12px;margin-bottom:2px}
.dr button.on{background:#e7efeb;font-weight:700}.dr .gh{font-weight:600}
.sub{margin:0 0 6px 14px;border-left:2px solid var(--line)}.sub button{font-weight:400}.sub small{display:block;padding:6px 12px;color:var(--mut)}
.ov{position:fixed;inset:0;background:#0006;z-index:10;display:none}.ov.on{display:block}
@media(prefers-reduced-motion:reduce){.dr{transition:none}}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar>input,.bar>select{width:auto;flex:1 1 180px;max-width:320px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 auto 14px;max-width:760px}
.fm>*{min-width:0}.fm label{font-size:14px;color:var(--mut)}
.fm .rt,.fm .tr,.fm .sig,.fm .full,.fm .nts,.fm .sbt{grid-column:1/-1}.fm .sbt{justify-self:end}
.tr{text-align:right;font-size:18px}.du{font-size:17px;padding-bottom:6px}
.sig{text-align:right;margin-top:18px}.sig span{display:inline-block;min-width:190px;border-top:1px solid #444;text-align:center;padding-top:3px;font-size:14px;color:var(--mut)}
.nk{display:grid;grid-template-columns:auto auto auto;justify-content:end;column-gap:8px}.nk b{text-align:right}.np{text-align:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.nts{border:1px dashed var(--pine);border-radius:6px;padding:8px 12px;background:#f1f6f4}
.fr{display:flex;gap:8px;margin:6px 0}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
table{border-collapse:collapse;width:100%}.tw table{min-width:520px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
th{background:#e7efeb}td.ac,th.ac{white-space:nowrap;text-align:right}
td input,td select{width:100%}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px}.sum small{color:var(--mut);display:block}.sum b{font-size:21px}
.msg{padding:8px 12px;border-radius:6px;background:#fbe9e7;color:#8a1f11;margin-bottom:12px;display:none}
h3{margin:14px 0 8px;font-size:17px;color:var(--pine)}
.lp{height:60px;border:1px dashed #b9c9c3;border-radius:6px;display:block;margin:6px 0;padding:4px;background:#fff}
#fpk label{display:flex;flex-direction:column;gap:4px;margin:0}#fpk input,#fpk select,#fpk textarea{height:44px;min-height:44px;resize:none;display:block}
.ap td input.w{width:92px}.ap td input.nt{width:150px}
@media(max-width:600px){main{padding:12px}.tr{font-size:16px}header .o span{display:none}}

#pp{display:none}
@page{size:A4;margin:.5in .5in .3in}
@media print{
 html,body{background:#fff!important}
 body>*:not(#pp){display:none!important}

 #pp .tt2{width:50%;margin:8px 0 0 auto}#pp .tt2 td{border:1px solid #000;padding:4px 8px;font-weight:600}#pp .tt2 td+td{text-align:right}
 #pp .pn{margin-top:14px;font-size:11pt;border:1px solid #000;padding:6px 8px}
 #pp .sg{margin-top:56px;display:flex;justify-content:flex-end}#pp .sg span{border-top:1px solid #000;padding-top:4px;min-width:190px;text-align:center}
 #pp .pf{position:fixed;left:0;right:0;bottom:0;width:100%;font-size:9pt;text-align:right;border-top:2px solid #000;padding-top:5px;background:#fff!important}
}
</style>

<script>
const API='https://script.google.com/macros/s/AKfycbzEzpIXppMRvTq4_zq553jeTH_xszrzz5grkJLes-tx7hIEf_xGkYoABmzjIBAlEVyDXQ/exec';
const ST=['নতুন','প্রক্রিয়াধীন','কাগজপত্র বাকি','সম্পন্ন','বাতিল'],PL=['হাতে নগদ','ব্যাংক','বিকাশ','নগদ','অন্যান্য'];
const TT={apps:'আবেদন',inc:'আয়',exp:'ব্যয়',cash:'ক্যাশ',join:'স্টাফ: যোগদান',sal:'স্টাফ: বেতন/ভাতা',rep:'রিপোর্ট',web:'ব্যবস্থাপনা: ওয়েব তথ্য',svc:'ব্যবস্থাপনা: সেবা তালিকা',adm:'অ্যাডমিন'};
let T=sessionStorage.getItem('t'),D={apps:[],vouchers:[],cash:[],staff:[],salaries:[],admins:[],services:[],packages:[],settings:{},me:{},next:{}},logo,hero,cur='',view='apps',navKey='',pkKey='';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>Number(v)||0,bn=n=>N(n).toLocaleString('bn-BD'),mny=n=>'৳ '+bn(n),sum=(a,k)=>a.reduce((t,x)=>t+N(x[k]),0);
const today=()=>new Date().toLocaleDateString('en-CA');
const msg=t=>{const m=$('#m');m.textContent=t;m.style.display=t?'block':'none';if(t)window.scrollTo({top:0,behavior:'smooth'})};
async function call(d){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...d,token:T})});const j=await r.json();
 if(j.auth===false){expired();throw new Error('সেশন শেষ, আবার লগইন করুন')}if(!j.ok)throw new Error(j.error||'ত্রুটি');return j}
function expired(){T=null;sessionStorage.removeItem('t');$('#lg').hidden=false;$('#ap').hidden=true}
function logout(){sessionStorage.removeItem('t');location.href='index.html'}
const sv_=(p)=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={e:sv_('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>'),p:sv_('<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'),d:sv_('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>')};
const ib=(a,e,id,t)=>`<button type="button" class="ib${a==='d'?' dl':''}" data-a="${a}" data-e="${e}" data-id="${esc(id)}" title="${t}" aria-label="${t}">${IC[a]}</button>`;

// ---- প্রিন্ট (A4, সাদা-কালো, অফিসিয়াল) ----
function printDoc(o){const S=D.settings||{},B=o.blocks||[{heads:o.heads,rows:o.rows}];
 $('#pp').innerHTML=`<div class="ph"><div>${S.logo?`<img src="${esc(S.logo)}" alt="">`:''}</div><div class="pc"><h1>${esc(S.siteName||'অফিস')}</h1><p>${esc([S.address,S.phone,S.email].filter(Boolean).join(' | '))}</p></div><div></div></div><h2>${esc(o.title)}</h2>
 ${o.meta?`<div class="pm">${o.meta.map(([l,v])=>`<span>${esc(l)}: <b>${esc(v)}</b></span>`).join('')}</div>`:''}
 ${B.map(b=>`${b.h?`<h3>${esc(b.h)}</h3>`:''}<table class="pb"><thead><tr>${b.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${b.heads.length}">—</td></tr>`}</tbody></table>`).join('')}
 ${o.totals?`<table class="tt2">${o.totals.map(([l,v])=>`<tr><td>${esc(l)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`:''}
 ${o.notes?`<div class="pn">${o.notes.map(([l,v])=>`<div>${esc(l)}: <b>${esc(v)}</b></div>`).join('')}</div>`:''}
 ${o.sign?'<div class="sg"><span>স্বাক্ষর</span></div>':''}<div class="pf">©copyright: AM Shahed: 01605721296</div>`;
 window.print()}
const kv=(title,p,sign)=>({title,heads:['বিষয়','তথ্য'],rows:p.filter(x=>x[1]!==''&&x[1]!=null),sign});

// ---- হিসাবের সহায়ক ----
const inc=d=>sum(D.vouchers.filter(v=>v.type==='আয়'&&(!d||v.date===d)),'total');
const expPaid=d=>sum(D.vouchers.filter(v=>v.type==='ব্যয়'&&(!d||v.date===d)),'paid')+sum(D.salaries.filter(s=>!d||s.date===d),'amount');
const cashNotes=(d,l)=>[[l+'মোট আয়',mny(inc(d))],[l+'মোট ব্যয়',mny(expPaid(d))],['বর্তমান ক্যাশ',mny(inc()-expPaid())]];
const placeBal=()=>PL.map(p=>p+': '+mny(D.cash.reduce((t,c)=>t+c.items.filter(x=>x.t===p).reduce((s,x)=>s+(c.type==='জমা'?N(x.a):-N(x.a)),0),0))).join(' | ');
const sm=a=>(a||[]).map(x=>x.t).filter(Boolean).join(', ');
const svc=()=>D.services.find(s=>s.id===cur)||{name:'',fields:[]};
const svcName=id=>(D.services.find(s=>s.id===id)||{}).name||'';
const pV=v=>{const x=v.type==='ব্যয়';return{title:x?'ব্যয়ের ভাউচার':'আয়ের রশিদ',meta:[[x?'ভাউচার নং':'রশিদ নং',v.no],['তারিখ',v.date]],heads:['ক্রম','বিবরণ','পরিমাণ'],rows:v.items.map((i,k)=>[bn(k+1),i.t,mny(i.a)]),totals:[['সর্বমোট',mny(v.total)],...(x?[['পরিশোধ',mny(v.paid)],['বকেয়া',mny(N(v.total)-N(v.paid))]]:[])],sign:true}};

function addRow(r,t='',a=''){const c=r.dataset.m==='c',tr=document.createElement('tr');
 tr.innerHTML=`<td class="sn"></td><td>${c?`<input class="rt1" maxlength="200" list="cdl" autocomplete="off" placeholder="ক্যাশ বিবরণ লিখুন" value="${esc(t)}">`:`<input class="rt1" maxlength="200" value="${esc(t)}">`}</td><td><input class="rt2" type="number" min="0" step="any" value="${esc(a)}"></td><td><button type="button" class="ib rm" aria-label="সারি মুছুন">×</button></td>`;
 r.querySelector('tbody').appendChild(tr);renum(r)}
function renum(r){r.querySelectorAll('.sn').forEach((c,i)=>c.textContent=bn(i+1))}
function setRows(f,items){const r=f.querySelector('.rt');r.querySelector('tbody').innerHTML='';(items.length?items:[{}]).forEach(x=>addRow(r,x.t||'',x.a||''))}
const rowsOf=f=>[...f.querySelectorAll('.rt tbody tr')].map(tr=>({t:tr.querySelector('.rt1').value.trim(),a:Number(tr.querySelector('.rt2').value)||0})).filter(x=>x.a>0);
function cashNote(){const f=$('#fcs'),m={};f.querySelectorAll('.rt tbody tr').forEach(tr=>{const t=tr.querySelector('.rt1').value.trim(),a=N(tr.querySelector('.rt2').value);if(t&&a>0)m[t]=(m[t]||0)+a});
 const p=Object.entries(m).map(([k,v])=>k+': '+mny(v)).join(' | ');
 $('#cn').innerHTML=`<div class="nk">${cashNotes(today(),'আজকের ').map(([l,v])=>`<span>${esc(l)}</span><span>:</span><b>${esc(v)}</b>`).join('')}</div><div class="np">সংরক্ষিত স্থান অনুযায়ী: <b>${esc(p||'—')}</b></div>`}
function recalc(f){if(f.id==='fcs')cashNote();const t=[...f.querySelectorAll('.rt2')].reduce((s,i)=>s+N(i.value),0);f.querySelector('.tt').textContent=mny(t);const p=f.elements.paid;if(p)f.querySelector('.du b').textContent=mny(Math.max(0,t-N(p.value)))}
function fillV(f,v){sv(f,v,['no','date']);setRows(f,v.items);if(f.elements.paid)f.elements.paid.value=N(v.paid);recalc(f)}
function addFld(f,v=''){const d=document.createElement('div');d.className='fr';d.innerHTML=`<input class="fi" maxlength="60" placeholder="ফিল্ডের নাম (যেমন: খরচ)" value="${esc(v)}"><button type="button" class="ib rm2" aria-label="মুছুন">×</button>`;f.querySelector('.fl').appendChild(d)}

 const n=f.elements.no;if(n&&!f.elements.rid.value)n.value=(D.next[f.id==='fvi'?'R':f.id==='fcs'?'C':f.id==='fsl'?'S':'V']||'')}
function fillWeb(){const S=D.settings||{},f=$('#fset');['siteName','phone','email','address','hours','facebook','instagram','youtube'].forEach(k=>f.elements[k].value=S[k]||'');
 if(logo===undefined){$('#lpv').src=S.logo||'';$('#lpv').hidden=!S.logo}
 if(hero===undefined){$('#hpv').src=S.hero||'';$('#hpv').hidden=!S.hero}}
function resetClose(f){f.reset();f.querySelectorAll('.rt').forEach(r=>{r.querySelector('tbody').innerHTML='';addRow(r);if(r.dataset.m==='v')addRow(r)});
 const fl=f.querySelector('.fl');if(fl){fl.innerHTML='';addFld(f)}
 if(f.id==='fa')f.elements.password.required=true;if(f.id==='fset'){logo=undefined;hero=undefined}
 const b=f.querySelector('.sbt');if(b)b.textContent='সংরক্ষণ';
 f.hidden=true;const t=$('.tg[data-f="'+f.id+'"]');if(t)t.textContent=t.dataset.o;if(f.querySelector('.tt'))recalc(f);setDef(f)}
function openForm(f){f.hidden=false;if(f.id==='fset')fillWeb();setDef(f);const t=$('.tg[data-f="'+f.id+'"]');if(t)t.textContent='ফর্ম বন্ধ করুন';f.scrollIntoView({behavior:'smooth',block:'start'})}

 D.salaries.filter(s=>ok(s.date)).forEach(s=>X.push([s.date,s.no||'বেতন','বেতন/ভাতা: '+s.staffName+(s.month?' ('+s.month+')':''),s.amount]));
 const so=(a,b)=>String(b[0]).localeCompare(String(a[0]));I.sort(so);X.sort(so);const s3=a=>a.reduce((t,r)=>t+N(r[3]),0);
 return{I,X,a:s3(I),b:s3(X),due:V.filter(v=>v.type==='ব্যয়').reduce((t,v)=>t+N(v.total)-N(v.paid),0),label:{d:'দৈনিক: '+key,m:'মাসিক: '+key,y:'বাৎসরিক: '+key,a:'সকল'}[t]}}

 const tb=(L)=>`<div class="tw"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${L.map(row).join('')||'<tr><td colspan="4">কিছু নেই</td></tr>'}</tbody></table></div>`;
 $('#ro').innerHTML=`<div class="sum">${[['মোট আয়',mny(r.a)],['মোট ব্যয়',mny(r.b)],[p>=0?'লাভ':'ক্ষতি',mny(Math.abs(p))],['ব্যয়ের বকেয়া',mny(r.due)]].map(([l,v])=>`<div><small>${l}</small><b>${v}</b></div>`).join('')}</div><h3>আয়ের তালিকা</h3>${tb(r.I)}<h3>ব্যয়ের তালিকা (বেতন সহ)</h3>${tb(r.X)}`}
